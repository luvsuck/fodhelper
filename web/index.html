<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>加工单助手</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-600: #1d4ed8;
            --primary-50: #eff6ff;
            --bg: #f1f5f9;
            --panel: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --danger: #ef4444;
            --danger-50: #fef2f2;
            --success: #059669;
            --amber: #d97706;
            --amber-50: #fffbeb;
            --sidebar-bg: #1e293b;
            --sidebar-border: #334155;
            --sidebar-text: #cbd5e1;
            --sidebar-muted: #94a3b8;
            --radius: 12px;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
            --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 8px 24px rgba(15, 23, 42, .05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- 侧边栏 ---------- */

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 22px 20px;
            border-bottom: 1px solid var(--sidebar-border);
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #4f8cff);
            color: #fff;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .brand-name {
            font-weight: 600;
            font-size: 16px;
            color: #f1f5f9;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--sidebar-muted);
            margin-top: 2px;
        }

        .side-nav {
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            transition: background .15s;
        }

        .nav-item:hover {
            background: var(--sidebar-border);
            color: #f1f5f9;
        }

        .nav-item.active {
            background: var(--primary);
            color: #fff;
        }

        .side-foot {
            margin-top: auto;
            padding: 16px 20px;
            border-top: 1px solid var(--sidebar-border);
            font-size: 12px;
            line-height: 1.7;
            color: var(--sidebar-muted);
        }

        .side-foot b {
            color: var(--sidebar-text);
            font-weight: 600;
        }

        /* ---------- 内容区 ---------- */

        .content {
            flex: 1;
            padding: 24px 28px 48px;
            max-width: 1240px;
            min-width: 0;
        }

        /* 工具栏 */

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            min-width: 0;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color .15s, box-shadow .15s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-50);
        }

        /* 按钮 */

        .btn {
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, box-shadow .15s, border-color .15s, color .15s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-600);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover {
            background: #047857;
        }

        .btn-ghost {
            background: #fff;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .btn-danger {
            background: #fff;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .btn-danger:hover {
            background: var(--danger-50);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
        }

        /* 面板 */

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .panel-head h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .panel-hint {
            font-size: 12px;
            color: var(--muted);
        }

        #container,
        #cardContainer {
            padding: 20px;
        }

        /* ---------- 订单分组 ---------- */

        .order-group {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #fbfcfe;
            padding: 18px;
            margin-bottom: 18px;
        }

        .order-group:last-child {
            margin-bottom: 0;
        }

        .order-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .order-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .order-badge {
            background: var(--primary-50);
            color: var(--primary-600);
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 999px;
        }

        .order-product {
            font-weight: 600;
            font-size: 15px;
        }

        .tag {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 500;
        }

        .tag-split {
            background: var(--amber-50);
            color: var(--amber);
            border: 1px solid #fde68a;
        }

        .date-field {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        .date-field input {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
        }

        .date-field input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-50);
        }

        /* ---------- 材料卡片 ---------- */

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }

        .material-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: box-shadow .15s;
        }

        .material-card:hover {
            box-shadow: var(--shadow);
        }

        .material-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .material-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
        }

        .material-len {
            font-size: 12px;
            color: var(--primary-600);
            background: var(--primary-50);
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .material-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .material-fields label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .material-fields .field-full {
            grid-column: 1 / -1;
        }

        .material-fields select,
        .material-fields input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            width: 100%;
            background: #fff;
        }

        .material-fields select:focus,
        .material-fields input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-50);
        }

        .material-card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        /* ---------- 标签卡片 ---------- */

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border);
        }

        .card-content {
            font-size: 13px;
            line-height: 2;
            color: var(--muted);
            padding: 10px 0;
        }

        .card-content b {
            color: var(--text);
            font-weight: 600;
        }

        .qr {
            text-align: center;
            margin-top: auto;
            padding-top: 8px;
        }

        .qr img {
            width: 120px;
            height: 120px;
        }

        .card.shelf-card {
            background: var(--amber-50);
            border-color: #fde68a;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 36px 0;
        }

        /* ---------- 更新日志按钮 / 弹窗 ---------- */

        .btn-changelog {
            width: 100%;
            margin-top: 12px;
            padding: 9px 12px;
            background: var(--sidebar-border);
            color: var(--sidebar-text);
            border: 1px solid #475569;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background .15s, color .15s;
        }

        .btn-changelog:hover {
            background: #475569;
            color: #fff;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
        }

        .modal-backdrop[hidden] {
            display: none;
        }

        .modal {
            background: #fff;
            border-radius: 14px;
            max-width: 480px;
            width: 100%;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-head h2 {
            margin: 0;
            font-size: 16px;
        }

        .modal-close {
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            line-height: 1;
            padding: 0;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 8px 20px 20px;
            overflow-y: auto;
        }

        .cl-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .cl-item:last-child {
            border-bottom: none;
        }

        .cl-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .cl-version {
            font-weight: 700;
            font-size: 14px;
            color: var(--primary-600);
        }

        .cl-date {
            font-size: 12px;
            color: var(--muted);
        }

        .cl-changes {
            margin: 0;
            padding-left: 18px;
            font-size: 13px;
            line-height: 1.8;
        }

        /* ---------- 打印 ---------- */

        @media print {
            .sidebar,
            .toolbar,
            .panel-head,
            #order-panel {
                display: none;
            }

            body {
                display: block;
                background: #fff;
            }

            .content {
                padding: 0;
                max-width: none;
            }

            .panel {
                border: none;
                box-shadow: none;
            }

            .card {
                page-break-inside: avoid;
            }
        }

        /* ---------- 响应式 ---------- */

        @media (max-width: 820px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: row;
                align-items: center;
                padding: 12px 16px;
                gap: 16px;
            }

            .brand {
                border-bottom: none;
                padding: 0;
            }

            .side-nav {
                flex-direction: row;
                padding: 0;
                margin-left: auto;
            }

            .side-foot {
                display: none;
            }

            .content {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">工</div>
            <div class="brand-text">
                <div class="brand-name">加工单助手</div>
                <div class="brand-sub">货物生成 · 标签打印</div>
            </div>
        </div>
        <nav class="side-nav">
            <a href="#order-panel" class="nav-item active">加工单明细</a>
            <a href="#label-panel" class="nav-item">标签预览</a>
        </nav>
        <div class="side-foot">
            <p>支持输入 <b>加工单 ID</b>，或 <b>P 开头</b>的货物唯一码（逗号 / 换行分隔）。</p>
            <button class="btn-changelog" onclick="openChangelog()">更新日志</button>
        </div>
    </aside>

    <main class="content">
        <section class="toolbar">
            <div class="search-box">
                <input id="orderId" placeholder="输入加工单 ID 或货物唯一码">
            </div>
            <button class="btn btn-primary" onclick="loadOrder()">查询</button>
            <button class="btn btn-success" onclick="submitData()">一键生成</button>
        </section>

        <section id="order-panel" class="panel">
            <div class="panel-head">
                <h2>加工单明细</h2>
                <span class="panel-hint">分切产物需填写涂布日期</span>
            </div>
            <div id="container"></div>
        </section>

        <section id="label-panel" class="panel">
            <div class="panel-head">
                <h2>标签预览</h2>
            </div>
            <div id="cardContainer" class="card-container">
                <div class="empty">查询或生成后在此显示标签</div>
            </div>
        </section>
    </main>

    <!-- 更新日志弹窗 -->
    <div class="modal-backdrop" id="changelogModal" hidden>
        <div class="modal">
            <div class="modal-head">
                <h2>更新日志</h2>
                <button class="modal-close" onclick="closeChangelog()">×</button>
            </div>
            <div class="modal-body" id="changelogList"></div>
        </div>
    </div>

    <script>
        let rows = [];
        let specCache = {}, supplierCache = {};

        /* 当天日期（YYYY-MM-DD） */

        function todayStr() {
            const d = new Date()
            const m = String(d.getMonth() + 1).padStart(2, "0")
            const day = String(d.getDate()).padStart(2, "0")
            return `${d.getFullYear()}-${m}-${day}`
        }

        /* 查询订单（自动分流：唯一码 / 加工单） */

        function loadOrder() {

            const raw = document.getElementById("orderId").value.trim()
            if (!raw) {
                alert("请输入加工单 ID 或货物唯一码")
                return
            }

            const goodsNums = parseGoodsNums(raw)
            if (goodsNums.length && goodsNums.every(n => /^P/i.test(n))) {
                loadGoodsCards(goodsNums)
                return
            }

            fetch("/api/order/" + raw)
                .then(r => r.json())
                .then(data => {
                    rows = data
                    render()
                })
                .catch(e => alert("查询失败：" + e.message))
        }

        /* 解析唯一码输入（逗号 / 空格 / 换行 / 引号分隔） */

        function parseGoodsNums(input) {
            return input.replace(/'/g, " ").split(/[\s,]+/).filter(t => t.length > 0)
        }

        /* 根据唯一码生成卡片 */

        function loadGoodsCards(goodsNums) {
            fetch("/api/goods-cards", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ goodsNums })
            })
                .then(async r => {
                    const data = await r.json()
                    if (!r.ok) throw new Error(data.detail || "请求失败")
                    return data
                })
                .then(d => {
                    renderCards(d)
                    if (!d.goodsCards || d.goodsCards.length === 0) {
                        alert("未找到对应货物")
                    }
                })
                .catch(e => alert(e.message))
        }

        /* 渲染加工单明细 */

        function render() {

            const container = document.getElementById("container")
            container.innerHTML = ""

            if (!rows.length) {
                container.innerHTML = '<div class="empty">暂无数据，请输入加工单 ID 查询</div>'
                return
            }

            rows.forEach((od, odIndex) => {

                const isSplit = Number(od.processType) === 3
                const dateValue = isSplit ? todayStr() : (od.coatingDate || '')

                const group = document.createElement("section")
                group.className = "order-group"

                const cards = od.materials.map((m, i) => `
                    <div class="material-card">
                        <div class="material-card-head">
                            <span class="material-name">${m.productName}</span>
                            <span class="material-len">需 ${m.estimateCount} 米</span>
                        </div>
                        <div class="material-fields">
                            <label>规格
                                <select id="spec_${odIndex}_${i}"></select>
                            </label>
                            <label>供应商
                                <select id="supplier_${odIndex}_${i}"></select>
                            </label>
                            <label class="field-full">长度（米）
                                <input type="number" min="0" step="any" value="${m.estimateCount}" onchange="rows[${odIndex}].materials[${i}].estimateCount=this.value">
                            </label>
                        </div>
                        <div class="material-card-actions">
                            <button class="btn btn-sm btn-ghost" onclick="duplicate(${odIndex},${i})">复制</button>
                            <button class="btn btn-sm btn-ghost" onclick="split(${odIndex},${i})">拆分</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteMaterial(${odIndex},${i})">删除</button>
                        </div>
                    </div>
                `).join("")

                group.innerHTML = `
                    <div class="order-head">
                        <div class="order-title">
                            <span class="order-badge">#${od.orderDetailId}</span>
                            <span class="order-product">${od.targetProduct}</span>
                            ${isSplit ? '<span class="tag tag-split">分切</span>' : ''}
                        </div>
                        <label class="date-field">
                            <span>涂布日期${isSplit ? '（必填）' : ''}</span>
                            <input type="date" id="coatingDate_${odIndex}" value="${dateValue}" ${isSplit ? 'required' : ''}>
                        </label>
                    </div>
                    <div class="materials-grid">${cards}</div>
                `

                container.appendChild(group)
            })

            rows.forEach((od, odIndex) => {
                od.materials.forEach((m, i) => {
                    loadSpec(odIndex, i, m.productNo, m.spec)
                    loadSupplier(odIndex, i, m.productNo, m.supplierId)
                })
            })
        }

        /* 行操作 */

        function duplicate(odIndex, i) {
            const m = JSON.parse(JSON.stringify(rows[odIndex].materials[i]))
            rows[odIndex].materials.splice(i + 1, 0, m)
            render()
        }

        function deleteMaterial(odIndex, i) {
            rows[odIndex].materials.splice(i, 1)
            render()
        }

        function split(odIndex, i) {

            const n = parseInt(prompt("生成几份"))
            if (!n || n <= 1) return

            const row = rows[odIndex].materials[i]
            const length = (row.estimateCount / n).toFixed(2)

            rows[odIndex].materials.splice(i, 1)

            for (let k = 0; k < n; k++) {
                rows[odIndex].materials.splice(i + k, 0, {
                    productNo: row.productNo,
                    productName: row.productName,
                    estimateCount: length,
                    spec: row.spec,
                    supplierId: row.supplierId,
                    supplierName: row.supplierName
                })
            }

            render()
        }

        /* 规格 */

        function loadSpec(odIndex, i, productNo, defaultSpec) {

            if (specCache[productNo]) {
                renderSpec(odIndex, i, specCache[productNo], defaultSpec)
                return
            }

            fetch("/api/spec/" + productNo)
                .then(r => r.json())
                .then(data => {
                    specCache[productNo] = Array.from(new Set(data))
                    renderSpec(odIndex, i, specCache[productNo], defaultSpec)
                })
        }

        function renderSpec(odIndex, i, data, defaultSpec) {

            const select = document.getElementById(`spec_${odIndex}_${i}`)
            if (!select) return

            select.innerHTML = ""

            data.forEach(v => {
                const op = document.createElement("option")
                op.value = v
                op.text = v
                if (v === defaultSpec) op.selected = true
                select.appendChild(op)
            })
        }

        /* 供应商 */

        function loadSupplier(odIndex, i, productNo, defaultId) {

            if (supplierCache[productNo]) {
                renderSupplier(odIndex, i, supplierCache[productNo], defaultId)
                return
            }

            fetch("/api/supplier/" + productNo)
                .then(r => r.json())
                .then(data => {

                    const map = new Map()

                    data.forEach(s => {
                        map.set(s.CompanyPurchaseSupplierId, s.SupplierName)
                    })

                    const arr = []
                    map.forEach((name, id) => {
                        arr.push({ CompanyPurchaseSupplierId: id, SupplierName: name })
                    })

                    supplierCache[productNo] = arr
                    renderSupplier(odIndex, i, arr, defaultId)

                })
                .catch(e => {
                    console.log(e)
                    alert(e.message)
                })
        }

        function renderSupplier(odIndex, i, data, defaultId) {

            const select = document.getElementById(`supplier_${odIndex}_${i}`)
            if (!select) return

            select.innerHTML = ""

            data.forEach(v => {

                const op = document.createElement("option")
                op.value = v.CompanyPurchaseSupplierId
                op.text = v.SupplierName

                if (v.CompanyPurchaseSupplierId == defaultId)
                    op.selected = true

                select.appendChild(op)
            })
        }

        /* 提交 */

        function submitData() {

            // 分切产物必须填写涂布日期
            for (let i = 0; i < rows.length; i++) {
                if (Number(rows[i].processType) === 3 && !document.getElementById(`coatingDate_${i}`)?.value) {
                    alert("分切产物必须填写涂布日期")
                    return
                }
            }

            const result = []

            rows.forEach((od, odIndex) => {
                const coatingDate = document.getElementById(`coatingDate_${odIndex}`)?.value || null

                od.materials.forEach((m, i) => {

                    const specSelect = document.getElementById(`spec_${odIndex}_${i}`)
                    const spec = specSelect ? specSelect.value : m.spec

                    const supplierSelect = document.getElementById(`supplier_${odIndex}_${i}`)
                    const supplierId = supplierSelect ? supplierSelect.value : m.supplierId
                    const supplierName = supplierSelect ? supplierSelect.options[supplierSelect.selectedIndex].text : m.supplierName

                    result.push({
                        productNo: m.productNo,
                        spec: spec,
                        supplierId: supplierId,
                        supplierName: supplierName,
                        length: m.estimateCount,
                        coatingDate: coatingDate
                    })
                })
            })

            fetch("/api/generate", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'X-FinishedOrderId': document.getElementById("orderId").value
                },
                body: JSON.stringify(result)
            })
                .then(async r => {
                    const data = await r.json()
                    if (!r.ok) {
                        throw new Error(data.detail || "请求失败")
                    }
                    return data
                })
                .then(d => {
                    alert("生成 " + d.count + " 条数据")
                    renderCards(d)
                })
                .catch(e => {
                    alert(e.message)
                })
        }

        /* 渲染标签 */

        function renderCards(data) {

            const container = document.getElementById("cardContainer")
            container.innerHTML = ""

            data.goodsCards.forEach(c => {

                const div = document.createElement("div")
                div.className = "card"

                div.innerHTML = `
                    <div class="card-title">${c.goodsName}</div>
                    <div class="card-content">
                        产品编码：<b>${c.productNo}</b><br>
                        唯一码：<b>${c.goodsNum}</b><br>
                        规格：${c.spec}<br>
                        供应商：${c.supplierName}<br>
                        长度：${c.length} 米
                    </div>
                    <div class="qr">
                        <img src="data:image/png;base64,${c.qrCode}">
                    </div>
                `

                container.appendChild(div)
            })

            data.shelfCards.forEach(c => {

                const div = document.createElement("div")
                div.className = "card shelf-card"

                div.innerHTML = `
                    <div class="card-title">货架：${c.shelfName}</div>
                    <div class="qr">
                        <img src="data:image/png;base64,${c.qrCode}">
                    </div>
                `

                container.appendChild(div)
            })
        }

        /* 更新日志 */

        function openChangelog() {
            fetch("/CHANGELOG.md")
                .then(r => r.text())
                .then(md => {
                    document.getElementById("changelogList").innerHTML = renderChangelog(md)
                    document.getElementById("changelogModal").hidden = false
                })
                .catch(e => alert("加载更新日志失败：" + e.message))
        }

        function closeChangelog() {
            document.getElementById("changelogModal").hidden = true
        }

        /* 解析 CHANGELOG.md：`## 版本 (日期)` 为条目，`- 内容` 为改动项 */

        function renderChangelog(md) {
            const items = []
            let cur = null
            for (const raw of md.split("\n")) {
                const line = raw.trim()
                const h = line.match(/^##\s+(.+?)\s*\((.+?)\)\s*$/)
                if (h) {
                    cur = { version: h[1], date: h[2], changes: [] }
                    items.push(cur)
                } else if (cur && /^[-*]\s+/.test(line)) {
                    cur.changes.push(mdInline(line.replace(/^[-*]\s+/, "")))
                }
            }
            return items.map(v => `
                <div class="cl-item">
                    <div class="cl-head">
                        <span class="cl-version">${esc(v.version)}</span>
                        <span class="cl-date">${esc(v.date)}</span>
                    </div>
                    <ul class="cl-changes">${v.changes.map(c => `<li>${c}</li>`).join("")}</ul>
                </div>
            `).join("")
        }

        function mdInline(s) {
            return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
        }

        function esc(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        }
    </script>
</body>
